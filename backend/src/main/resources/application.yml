server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 201MB
  application:
    name: youai-crm-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/youai_crm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 60000
      max-lifetime: 90000
      keepalive-time: 30000
      validation-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

rag:
  notebook:
    enabled: ${RAG_NOTEBOOK_ENABLED:false}
    endpoint: ${RAG_NOTEBOOK_ENDPOINT:http://rag-notebook:8091}
    token: ${RAG_INTERNAL_TOKEN:}

recording:
  deepseek:
    automatic-backfill: ${CALL_DRAFT_AUTOMATIC_BACKFILL:true}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    endpoint: ${DEEPSEEK_ENDPOINT:https://api.deepseek.com/chat/completions}
  storage:
    backend: ${RECORDING_STORAGE_BACKEND:file}
    directory: ${RECORDING_STORAGE_DIRECTORY:./data/recordings}
    s3:
      bucket: ${RECORDING_S3_BUCKET:}
      endpoint: ${RECORDING_S3_ENDPOINT:}
      region: ${RECORDING_S3_REGION:us-east-1}
      access-key: ${RECORDING_S3_ACCESS_KEY:}
      secret-key: ${RECORDING_S3_SECRET_KEY:}
      path-style: ${RECORDING_S3_PATH_STYLE:false}
  queue:
    concurrency: ${RECORDING_QUEUE_CONCURRENCY:1}
    enabled: ${RECORDING_QUEUE_ENABLED:true}
  local:
    enabled: ${LOCAL_ASR_ENABLED:false}
    endpoint: ${LOCAL_ASR_ENDPOINT:http://127.0.0.1:8766/transcribe}
  qwen:
    api-key: ${QWEN_ASR_API_KEY:}
    model: ${QWEN_ASR_MODEL:qwen3-asr-flash}
    endpoint: ${QWEN_ASR_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
    ffmpeg: ${FFMPEG_PATH:ffmpeg}
  ai:
    api-key: ${RECORDING_AI_API_KEY:}
    transcription-model: ${RECORDING_AI_TRANSCRIPTION_MODEL:}
    summary-model: ${RECORDING_AI_SUMMARY_MODEL:}

security:
  initial-admin-password: ${INITIAL_ADMIN_PASSWORD:}
  login:
    ip-max-attempts: ${LOGIN_IP_MAX_ATTEMPTS:30}
    ip-window-seconds: ${LOGIN_IP_WINDOW_SECONDS:60}
    account-max-failures: ${LOGIN_ACCOUNT_MAX_FAILURES:5}
    account-lock-seconds: ${LOGIN_ACCOUNT_LOCK_SECONDS:900}
  jwt:
    secret: ${JWT_SECRET:youke-crm-dev-secret-change-this-before-production-2026}
    access-ttl-hours: ${JWT_ACCESS_TTL_HOURS:2}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
