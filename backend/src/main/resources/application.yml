server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: youai-crm-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/youai_crm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 60000
      max-lifetime: 90000
      keepalive-time: 30000
      validation-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

security:
  login:
    ip-max-attempts: ${LOGIN_IP_MAX_ATTEMPTS:30}
    ip-window-seconds: ${LOGIN_IP_WINDOW_SECONDS:60}
    account-max-failures: ${LOGIN_ACCOUNT_MAX_FAILURES:5}
    account-lock-seconds: ${LOGIN_ACCOUNT_LOCK_SECONDS:900}
  jwt:
    secret: ${JWT_SECRET:youke-crm-dev-secret-change-this-before-production-2026}
    access-ttl-hours: ${JWT_ACCESS_TTL_HOURS:2}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
