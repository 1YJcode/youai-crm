spring:
  datasource:
    url: jdbc:h2:mem:youke_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

security:
  initial-admin-password: Admin@123
  jwt:
    secret: test-secret-at-least-32-bytes-long-for-jwt
    access-ttl-hours: 2
    refresh-ttl-days: 7
