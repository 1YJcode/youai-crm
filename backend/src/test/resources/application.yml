spring:
  profiles:
    active: dev
  datasource:
    url: ${TEST_DB_URL:jdbc:h2:mem:youke_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${TEST_DB_USERNAME:sa}
    password: ${TEST_DB_PASSWORD:}
    driver-class-name: ${TEST_DB_DRIVER:org.h2.Driver}
  flyway:
    enabled: ${TEST_DB_MIGRATE:false}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${TEST_DB_DDL:create-drop}

security:
  jwt:
    secret: test-secret-at-least-32-bytes-long-for-jwt
    access-ttl-hours: 2
    refresh-ttl-days: 7
