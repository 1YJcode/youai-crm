<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地录音转写试用</title>
<style>body{font:16px/1.7 system-ui;max-width:800px;margin:60px auto;padding:0 24px;color:#17252c;background:#f7fafb}main{background:white;padding:32px;border-radius:16px}button{background:#137b70;color:white;border:0;padding:12px 22px;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;font:inherit}small{color:#58676d}</style>
<main><h1>本地录音转写</h1><p id="model">正在读取当前模型…</p><p>录音在这台电脑处理，无需 API Key。当前仅试用转写，不区分销售和客户。</p><p><small>支持 WAV、MP3、M4A、FLAC、OGG，最大200MB、最长两小时。首次请用一至三分钟录音试效果。时间为模型估计，需核对。</small></p><input id="file" type="file" accept=".wav,.mp3,.m4a,.flac,.ogg"><p><button id="run">开始转写</button> <button id="save" hidden>下载原文</button></p><p id="status" role="status"></p><pre id="result"></pre></main>
<script>fetch('/health').then(r=>r.json()).then(data=>{document.querySelector('#model').textContent='当前模型：'+data.model+' · '+(data.device==='cuda'?'显卡加速':'CPU运行');}).catch(()=>{document.querySelector('#model').textContent='暂时无法读取模型状态';});const file=document.querySelector('#file'),run=document.querySelector('#run'),save=document.querySelector('#save'),status=document.querySelector('#status'),result=document.querySelector('#result');run.onclick=async()=>{const audio=file.files[0];if(!audio||!audio.size||audio.size>200*1024*1024){status.textContent='请选择不超过200MB的录音。';return}run.disabled=true;save.hidden=true;result.textContent='';status.textContent='正在本机转写，长录音可能需要较长时间，请保持页面打开…';try{const response=await fetch('/transcribe',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:audio});const data=await response.json();if(!response.ok)throw Error(data.error==='no_speech'?'未识别到语音，请检查录音。':'转写失败，请检查音频或本地服务。');result.textContent=data.text;status.textContent='转写完成。此试用页不会写入客户跟进记录，请下载原文。';save.hidden=false}catch(error){status.textContent=error.message}finally{run.disabled=false}};save.onclick=()=>{const url=URL.createObjectURL(new Blob([result.textContent],{type:'text/plain;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='录音转写.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};</script></html>
