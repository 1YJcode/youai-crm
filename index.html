    <symbol id="i-chat-circle" viewBox="0 0 24 24"><circle cx="12" cy="11" r="8"/><path d="m7 18-2 3 4-2M8 10h.01M12 10h.01M16 10h.01"/></symbol>

  <header class="topbar">
    <div class="topbar-main">
      <a class="brand" href="#dashboard" data-route="dashboard" aria-label="优爱首页">
        <img class="brand-logo" src="logo-youai.png" alt="优爱 YOUAI">
      </a>
      <button class="icon-button mobile-menu" id="mobileMenuButton" type="button" aria-label="展开导航"><svg><use href="#i-menu"></use></svg></button>
      <nav class="primary-nav" id="primaryNav" aria-label="主导航">
        <button class="nav-item active" type="button" data-view="dashboard"><svg><use href="#i-home"></use></svg><span>首页</span></button>
        <button class="nav-item" type="button" data-view="customers"><svg><use href="#i-users"></use></svg><span>客户管理</span></button>
        <button class="nav-item" type="button" data-view="calls"><svg><use href="#i-phone"></use></svg><span>呼叫中心</span></button>
        <button class="nav-item" type="button" data-view="orders"><svg><use href="#i-order"></use></svg><span>订单管理</span></button>
        <button class="nav-item" type="button" data-view="messages"><svg><use href="#i-message"></use></svg><span>消息中心</span><b class="nav-badge" id="messageBadge">6</b></button>
        <button class="nav-item admin-only-nav" type="button" data-view="system"><svg><use href="#i-sliders"></use></svg><span>系统管理</span></button>
        <button class="nav-item" type="button" data-view="analytics"><svg><use href="#i-chart"></use></svg><span>数据中心</span></button>
        <button class="nav-item admin-only-nav" type="button" data-view="finance"><svg><use href="#i-wallet"></use></svg><span>财务系统</span></button>
      </nav>
      <div class="top-actions">
        <span class="connection-status" id="connectionStatus" title="正在连接数据服务"><i></i><span>连接中</span></span>
        <form class="global-search" id="globalSearchForm" role="search" aria-label="全局搜索客户">
          <svg><use href="#i-search"></use></svg>
          <input id="globalSearch" type="search" placeholder="ID/号码/姓名" aria-label="搜索客户ID、号码或姓名" autocomplete="off">
          <button class="global-search-submit" type="submit" aria-label="搜索客户" title="搜索客户"><svg aria-hidden="true"><use href="#i-search"></use></svg></button>
        </form>
        <button class="header-call" id="headerCallButton" type="button" aria-label="打开呼叫中心"><svg><use href="#i-phone"></use></svg><span>呼叫</span><svg class="header-call-chevron"><use href="#i-down"></use></svg></button>
        <button class="icon-button notification-button" id="notificationButton" type="button" aria-label="通知"><svg><use href="#i-bell"></use></svg><span></span></button>
        <button class="user-menu" id="userMenu" type="button"><span class="avatar">林</span><span class="user-name">林夕</span><svg><use href="#i-down"></use></svg></button>
      </div>
    </div>
  </header>

  <nav class="workspace-tabs" id="workspaceTabs" aria-label="已打开功能" hidden></nav>

  <main id="app" tabindex="-1"></main>

  <aside class="help-rail" aria-label="帮助工具">
    <button type="button" data-help="帮助中心"><svg><use href="#i-help"></use></svg><span>帮助</span></button>
    <button type="button" data-help="学习中心"><svg><use href="#i-task"></use></svg><span>学习</span></button>
  </aside>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="detail-drawer" id="detailDrawer" aria-label="详情" aria-hidden="true"></aside>

  <div class="modal-backdrop customer-editor-backdrop" id="modalBackdrop" hidden>
    <section class="modal customer-editor-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-header">
        <div><p class="eyebrow">CUSTOMER PROFILE</p><h2 id="modalTitle">新增客户</h2></div>
        <button class="icon-button" id="closeModal" type="button" aria-label="关闭"><svg><use href="#i-close"></use></svg></button>
      </header>
      <form id="customerForm" class="customer-form customer-editor-form">
        <input type="hidden" name="customerId">
        <div class="customer-editor-body">
          <aside class="customer-avatar-panel">
            <h3>头像上传</h3>
            <label class="customer-avatar-upload"><input type="file" accept="image/*" aria-label="上传客户头像"><span>＋</span><strong>上传</strong></label>
          </aside>
          <section class="customer-basic-panel">
            <h3>基本信息</h3>
            <div class="customer-basic-grid">
              <label class="customer-editor-field"><span><i>*</i>姓名</span><input name="name" required placeholder="请输入"></label>
              <label class="customer-editor-field"><span><i>*</i>性别</span><select name="gender"><option value="">请选择</option><option>男</option><option>女</option></select></label>
              <label class="customer-editor-field"><span><i>*</i>年龄</span><input name="age" type="number" min="0" max="150" placeholder="请输入"></label>
              <label class="customer-editor-field"><span><i>*</i>电话号码</span><div class="customer-phone-input"><input name="phone" required pattern="1[3-9][0-9]{9}" placeholder="请输入"><button type="button" data-verify-phone>检测</button></div></label>
              <label class="customer-editor-field"><span><i>*</i>生日</span><input name="birthday" type="date"></label>
              <label class="customer-editor-field"><span><i>*</i>身高</span><input name="height" placeholder="请输入"></label>
              <label class="customer-editor-field"><span>职业</span><input name="occupation" placeholder="请输入职业"></label>
              <label class="customer-editor-field"><span>婚况</span><select name="maritalStatus"><option value="">请选择</option><option>未婚</option><option>离异</option><option>丧偶</option><option>未婚先育</option><option>离异未育</option><option>离异带孩</option><option>离异不带孩</option></select></label>
              <label class="customer-editor-field"><span><i>*</i>学历</span><select name="education"><option value="">请选择</option><option>高中及以下</option><option>中专</option><option>大专</option><option>本科</option><option>硕士</option><option>博士</option></select></label>
              <label class="customer-editor-field"><span>工作地</span><input name="workLocation" placeholder="请输入"></label>
              <label class="customer-editor-field"><span>月收入</span><input name="monthlyIncome" placeholder="请输入"></label>
              <label class="customer-editor-field"><span>年收入</span><input name="annualIncome" placeholder="请输入"></label>
              <label class="customer-editor-field"><span>微信号</span><input name="wechat" placeholder="请输入"></label>
              <label class="customer-editor-field"><span>籍贯</span><input name="nativePlace" placeholder="请输入"></label>
              <label class="customer-editor-field"><span>购车情况</span><input name="car" placeholder="请输入"></label>
              <label class="customer-editor-field"><span>房车情况</span><input name="vehicleHousing" placeholder="请输入"></label>
              <label class="customer-editor-field"><span>购房情况</span><input name="housing" placeholder="请输入"></label>
              <label class="customer-editor-field"><span>家庭情况</span><input name="familyStatus" placeholder="请输入"></label>
              <label class="customer-editor-field"><span>认证情况</span><input name="certificationStatus" placeholder="请输入"></label>
              <label class="customer-editor-field"><span>子女情况</span><input name="childrenStatus" placeholder="请输入"></label>
              <label class="customer-editor-field"><span>客户来源</span><select name="source"><option>线上咨询</option><option>老客转介绍</option><option>市场活动</option><option>主动开发</option></select></label>
              <label class="customer-editor-field"><span>所属公司</span><input name="company" placeholder="公司或机构名称"></label>
              <label class="customer-editor-field"><span>负责人</span><select name="owner"><option>林夕</option><option>陈晨</option><option>周倩</option><option>赵磊</option></select></label>
              <label class="customer-editor-field"><span>客户等级</span><select name="level"><option>重点客户</option><option>普通客户</option><option>潜在客户</option></select></label>
              <label class="customer-editor-field"><span>跟进阶段</span><select name="stage"><option>初步沟通</option><option>需求确认</option><option>方案报价</option><option>商务谈判</option><option>已成交</option><option>暂缓跟进</option><option>已流失</option></select></label>
              <label class="customer-editor-field"><span>预计金额</span><input name="amount" type="number" min="0" step="0.01" value="0"></label>
              <label class="customer-editor-field"><span>所在城市</span><input name="city" placeholder="例如：天津"></label>
              <label class="customer-editor-field"><span>下次跟进</span><input name="nextFollowAt" type="datetime-local"></label>
              <label class="customer-editor-field customer-editor-wide"><span>客户标签</span><input name="tags" placeholder="多个标签用逗号分隔"></label>
              <label class="customer-editor-field customer-editor-wide"><span>身份证号</span><input name="idCard" placeholder="请输入身份证号"></label>
            </div>
          </section>
          <aside class="customer-match-panel">
            <h3>择偶信息</h3>
            <div class="customer-match-grid">
              <label class="customer-editor-field"><span>年龄范围</span><input name="matchAgeRange" placeholder="请选择"></label>
              <label class="customer-editor-field"><span>婚况范围</span><input name="matchMaritalStatus" placeholder="请选择"></label>
              <label class="customer-editor-field"><span>身高范围</span><input name="matchHeightRange" placeholder="请选择"></label>
              <label class="customer-editor-field"><span>学历范围</span><input name="matchEducation" placeholder="请选择"></label>
              <label class="customer-editor-field"><span>月收入</span><input name="matchMonthlyIncome" placeholder="请选择"></label>
              <label class="customer-editor-field"><span>最在意对方</span><input name="matchMostImportant" placeholder="请输入"></label>
              <label class="customer-editor-field"><span>性格</span><input name="matchPersonality" placeholder="请输入"></label>
              <label class="customer-editor-field"><span>下一代需求</span><input name="matchChildren" placeholder="请选择"></label>
              <label class="customer-editor-field"><span>不希望 TA</span><input name="matchDealbreakers" placeholder="请输入"></label>
            </div>
          </aside>
        </div>
        <section class="customer-editor-notes"><h3>备注</h3><div class="customer-notes-grid"><label class="customer-editor-field"><span>客户备注</span><textarea name="note" rows="3" placeholder="记录客户需求、预算或下一步安排"></textarea></label><label class="customer-editor-field"><span>备注说明</span><textarea name="remark" rows="3"></textarea></label></div></section>
        <footer class="modal-footer customer-editor-footer"><button class="button secondary" id="cancelModal" type="button">取消</button><button class="button primary" type="submit"><svg><use href="#i-check"></use></svg>保存客户</button></footer>
      </form>
    </section>
  </div>

  <div class="modal-backdrop" id="businessModalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="businessModalTitle">
      <header class="modal-header">
        <div><p class="eyebrow" id="businessModalEyebrow">BUSINESS RECORD</p><h2 id="businessModalTitle">编辑记录</h2></div>
        <button class="icon-button" id="closeBusinessModal" type="button" aria-label="关闭"><svg><use href="#i-close"></use></svg></button>
      </header>
      <form id="businessForm" class="customer-form"></form>
    </section>
  </div>

  <div class="popover notification-popover" id="notificationPopover" hidden></div>
  <div class="popover user-popover" id="userPopover" hidden>
    <button type="button" id="profileButton"><svg><use href="#i-users"></use></svg>个人资料</button>
    <button type="button" id="settingsButton"><svg><use href="#i-building"></use></svg>企业设置</button>
    <button type="button" id="accountSwitchButton"><svg><use href="#i-repeat"></use></svg>切换账号</button>
    <button type="button" id="userHelpButton"><svg><use href="#i-help"></use></svg>使用帮助</button>
    <button type="button" id="logoutButton"><svg><use href="#i-log-out"></use></svg>退出登录</button>
  </div>
  <div class="modal-backdrop account-backdrop" id="accountBackdrop" hidden>
    <section class="modal account-modal" role="dialog" aria-modal="true" aria-labelledby="accountModalTitle">
      <header class="modal-header">
        <div><p class="eyebrow">ACCOUNT SWITCHING</p><h2 id="accountModalTitle">切换账号</h2></div>
        <button class="icon-button" id="closeAccountModal" type="button" aria-label="关闭"><svg><use href="#i-close"></use></svg></button>
      </header>
      <form id="accountSwitchForm" class="account-form">
        <label class="field"><span>选择登录账号</span><select id="accountSelect" name="username" required></select></label>
        <p class="account-hint" id="accountSwitchHint"></p>
        <footer class="modal-footer"><button class="button secondary" id="cancelAccountModal" type="button">取消</button><button class="button primary" type="submit"><svg><use href="#i-repeat"></use></svg>确认切换</button></footer>
      </form>
    </section>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <div id="followupAlertRegion" class="followup-alert-region" aria-live="polite" hidden></div>
  <script src="config.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="app.js?v=20260928-auth-hardening-v1"></script>
</body>
</html>
